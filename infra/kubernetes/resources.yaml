# Preparation template, not a verified deployment. See README.md before applying.
apiVersion: v1
kind: Namespace
metadata:
  name: gridx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gridx-config
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "4100"
  PUBLIC_BASE_URL: https://gridx.example.invalid
  COORDINATOR_PUBLIC_URL: https://gridx.example.invalid
  ALLOWED_ORIGINS: https://gridx.example.invalid
  # Replace with the actual ingress-controller source CIDR; never use true.
  TRUSTED_PROXIES: ""
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: c_optiforge
  DB_USER: gridx
  GRID_X_EXECUTION_MODE: docker
  RESEND_ENABLED: "false"
  POSTHOG_ENABLED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
    - {port: 3306, targetPort: 3306, name: mysql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{containerPort: 3306, name: mysql}]
          env:
            - {name: MYSQL_DATABASE, value: c_optiforge}
            - {name: MYSQL_USER, value: gridx}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: gridx-runtime, key: DB_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: gridx-runtime, key: MYSQL_ROOT_PASSWORD}}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: database, mountPath: /var/lib/mysql}]
          startupProbe:
            exec: {command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1"']}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1"']}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 20
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata: {name: database}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  # Connection ownership is process-local: do not scale until HA is implemented.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: coordinator}
  template:
    metadata:
      labels: {app: coordinator}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: coordinator
          image: registry.example.invalid/gridx/coordinator:REPLACE_WITH_VERIFIED_VERSION
          ports: [{containerPort: 4100, name: http}]
          envFrom:
            - configMapRef: {name: gridx-config}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: gridx-runtime, key: DB_PASSWORD}}
            - name: ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: gridx-runtime, key: ADMIN_USERNAME}}
            - name: ADMIN_PASSWORD_HASH
              valueFrom: {secretKeyRef: {name: gridx-runtime, key: ADMIN_PASSWORD_HASH}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            # Existing /health includes MySQL. DB faults should remove readiness,
            # not force coordinator restart loops and destroy live socket ownership.
            tcpSocket: {port: http}
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  selector: {app: coordinator}
  ports: [{port: 4100, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: registry.example.invalid/gridx/web:REPLACE_WITH_VERIFIED_VERSION
          ports: [{containerPort: 8080, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports: [{port: 8080, targetPort: http, name: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [gridx.example.invalid]
      secretName: gridx-tls
  rules:
    - host: gridx.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: coordinator, port: {number: 4100}}}
          - path: /ws
            pathType: Prefix
            backend: {service: {name: coordinator, port: {number: 4100}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 8080}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-internal-only
spec:
  podSelector:
    matchLabels: {app: mysql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: coordinator}
      ports: [{protocol: TCP, port: 3306}]
